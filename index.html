<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Mi Escuelita</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#234a95"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f6fb;--cd:#fff;--ink:#1b2a45;--mut:#5f6d88;--ln:#dbe3ef;--pri:#234a95;--on:#fff;--ok:#17734f;--okb:#dff2e8;--wn:#8a5a0c;--wnb:#fbecc9;--bd:#b23a28;--bdb:#fbe0da;--pb:#e2eafa;--mb:#ece8f6;--mc:#59458f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e1524;--cd:#16203a;--ink:#e6ecf8;--mut:#9aa8c4;--ln:#2a3857;--pri:#7fa6f5;--on:#0e1524;--ok:#6fd3a5;--okb:#12382b;--wn:#f0c36a;--wnb:#3b2d10;--bd:#f2907e;--bdb:#401b14;--pb:#1c2c52;--mb:#2a2347;--mc:#b8a6f0}}
:root[data-theme=dark]{--bg:#0e1524;--cd:#16203a;--ink:#e6ecf8;--mut:#9aa8c4;--ln:#2a3857;--pri:#7fa6f5;--on:#0e1524;--ok:#6fd3a5;--okb:#12382b;--wn:#f0c36a;--wnb:#3b2d10;--bd:#f2907e;--bdb:#401b14;--pb:#1c2c52;--mb:#2a2347;--mc:#b8a6f0}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,sans-serif;background-image:repeating-linear-gradient(transparent 0 31px,color-mix(in srgb,var(--pri) 10%,transparent) 31px 32px)}
h1,h2,h3{font-family:'Bricolage Grotesque',system-ui,sans-serif;margin:0}
header{position:sticky;top:0;z-index:5;background:var(--cd);border-bottom:2px solid var(--pri);box-shadow:0 3px 0 -1px var(--bd);padding:8px 14px 0}
header h1{font-size:22px;color:var(--pri)}nav{display:flex;gap:2px;overflow-x:auto;margin-top:4px}
nav button{border:0;background:none;color:var(--mut);padding:9px 12px;font:inherit;font-weight:600;border-bottom:3px solid transparent;white-space:nowrap;cursor:pointer}
nav button.on{color:var(--pri);border-color:var(--pri)}
main{max-width:980px;margin:0 auto;padding:14px}
.card{background:var(--cd);border:1px solid var(--ln);border-radius:10px;padding:12px;margin:0 0 10px;width:100%;text-align:left;color:inherit;font:inherit}
.gr{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}.gr .card{margin:0}
.k{font:700 24px 'Bricolage Grotesque',sans-serif}.m{color:var(--mut);font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.end{justify-content:flex-end;margin-top:12px}.sp{justify-content:space-between}
.b{background:var(--pri);color:var(--on);border:0;border-radius:8px;padding:9px 14px;font:inherit;font-weight:600;cursor:pointer}.b.g{background:var(--pb);color:var(--pri)}.b.r{background:var(--bdb);color:var(--bd)}.b:focus-visible,nav button:focus-visible,.les:focus-visible{outline:3px solid var(--wn);outline-offset:2px}
.les{display:flex;gap:8px;flex-wrap:wrap;align-items:center;cursor:pointer}.les b{min-width:100px}
.bd{font-size:12px;font-weight:700;border-radius:99px;padding:2px 9px;background:var(--pb);color:var(--pri)}.bd.ok{background:var(--okb);color:var(--ok)}.bd.w{background:var(--wnb);color:var(--wn)}.bd.b{background:var(--bdb);color:var(--bd)}.bd.m{background:var(--mb);color:var(--mc)}
label{display:block;font-size:13px;font-weight:600;margin:8px 0;color:var(--mut)}input,select,textarea{display:block;width:100%;margin-top:3px;padding:9px;border:1px solid var(--ln);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
input[type=checkbox]{display:inline;width:auto;margin-right:6px}label.c{display:flex;align-items:center;color:var(--ink);font-weight:500}
.ov{position:fixed;inset:0;background:#0008;z-index:20;display:flex;align-items:flex-end;justify-content:center}.md{background:var(--cd);width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:14px 14px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
@media(min-width:600px){.ov{align-items:center}.md{border-radius:14px}}
.mes{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.mes button{min-height:58px;border:1px solid var(--ln);background:var(--cd);color:inherit;border-radius:8px;font:inherit;cursor:pointer}.mes .h{min-height:0;border:0;background:none;font-size:12px;color:var(--mut)}
#t{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:30;max-width:90%}
.tag{font-size:12px;color:var(--mut)}hr{border:0;border-top:1px solid var(--ln)}
</style></head><body>
<header><h1>Mi Escuelita</h1><nav id="nav"></nav></header><main id="app"></main><div id="t" hidden></div>
<script>
const K='mie_v1',TZ='America/Argentina/Buenos_Aires';
let D;try{D=JSON.parse(localStorage.getItem(K))}catch(e){}
D=D||{clients:[],students:[],types:['Inglés de apoyo escolar','Inglés para principiantes','Inglés intensivo','Conversación en inglés'].map((n,i)=>({id:'t'+i,n,desc:'',dur:60,price:0,on:1})),lessons:[],pays:[],avail:{},blocks:[],travel:0};
const save=()=>{try{localStorage.setItem(K,JSON.stringify(D))}catch(e){}};
const $=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,9),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money=n=>new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS'}).format(n||0);
const today=()=>new Date().toLocaleDateString('en-CA',{timeZone:TZ});
const nowMin=()=>{const[a,b]=new Date().toLocaleTimeString('en-GB',{timeZone:TZ,hour:'2-digit',minute:'2-digit'}).split(':');return+a*60+ +b};
const tm=t=>{const[a,b]=t.split(':');return+a*60+ +b},mt=m=>String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
const addD=(d,n)=>{const x=new Date(d+'T12:00:00Z');x.setUTCDate(x.getUTCDate()+n);return x.toISOString().slice(0,10)},wd=d=>new Date(d+'T12:00:00Z').getUTCDay();
const DN=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'],fd=d=>DN[wd(d)]+' '+d.slice(8)+'/'+d.slice(5,7);
const S=i=>D.students.find(x=>x.id===i),C=i=>D.clients.find(x=>x.id===i),T=i=>D.types.find(x=>x.id===i);
const sn=s=>s?s.n+' '+s.a:'—',cn=c=>c?c.n+' '+c.a:'—',end=l=>mt(tm(l.start)+l.dur);
const isPast=l=>l.date<today()||(l.date===today()&&tm(l.start)+l.dur<=nowMin());
const amt=l=>(l.status==='agendada'&&l.att==='asistio')||l.cobrar?l.price:null;
const paid=l=>D.pays.reduce((a,p)=>a+p.alloc.filter(x=>x.lid===l.id).reduce((b,x)=>b+x.amt,0),0);
const debt=l=>{const a=amt(l);return a==null?0:Math.max(0,a-paid(l))};
const PS=l=>{const a=amt(l);if(a==null)return['',''];if(a===0)return['Sin cargo','m'];const p=paid(l);return p>=a?['Pagado','ok']:p>0?['Parcial','w']:['Pendiente','b']};
const CAT=l=>l.status!=='agendada'?l.status:l.att==='asistio'?'asistio':l.att==='no'?'no':isPast(l)?'pend':'futura';
const CL={asistio:['Asistió','ok'],no:['No asistió','b'],pend:['Por registrar','w'],futura:['Próxima',''],cancelada:['Cancelada','w'],rechazada:['Rechazada','b'],reprogramada:['Reprogramada','m']};
const cOf=l=>S(l.sid)?.cid;
D.exc=D.exc||{};D.tpl=D.tpl||[['Confirmación de clase','¡Hola, {nombre_tutor}! Te confirmo la clase de {nombre_alumno} ({tipo_clase}) el {fecha_clase} de {hora_clase} a {hora_fin}.'],['Recordatorio de clase','¡Hola, {nombre_tutor}! Te recuerdo que {nombre_alumno} tiene su próxima clase de inglés el {fecha_clase} a las {hora_clase}. ¡Nos vemos!'],['Recordatorio de pago','Hola, {nombre_tutor}. Te recuerdo que hay un saldo pendiente de {importe_pendiente}:\n{detalle_deuda}\n¡Gracias!'],['Confirmación de pago','Hola, {nombre_tutor}. Recibí tu pago, ¡muchas gracias!'],['Reprogramación','Hola, {nombre_tutor}. Necesito reprogramar la clase de {nombre_alumno} del {fecha_clase} a las {hora_clase}. ¿Te quedan bien otros horarios?'],['Cancelación','Hola, {nombre_tutor}. Lamentablemente tengo que cancelar la clase de {nombre_alumno} del {fecha_clase} a las {hora_clase}.'],['Presentación primera clase','¡Hola, {nombre_tutor}! Soy profesora de inglés. Me encantaría coordinar una primera clase con {nombre_alumno}. ¿Qué días te quedan bien?'],['Consulta de disponibilidad','Hola, {nombre_tutor}. ¿Qué días y horarios te vienen bien para las clases de {nombre_alumno}?'],['Envío de horarios','Hola, {nombre_tutor}. Estos son mis horarios libres:\n{horarios}\nAvisame cuál te sirve. El horario queda reservado cuando lo confirmo.'],['Mensaje personalizado','Hola, {nombre_tutor}. ']].map(([n,t])=>({id:uid(),n,t}));const G={v:'inicio',mes:today().slice(0,7),mode:'dia',date:today(),fs:'',fst:'',q:''};
const toast=m=>{const t=$('#t');t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,3500)};
const fld=(l,n,t='text',v='',x='')=>`<label>${l}<input name="${n}" type="${t}" value="${esc(v)}" ${x}></label>`;
const sel=(l,n,o,v='',x='')=>`<label>${l}<select name="${n}" ${x}>${o.map(([a,b])=>`<option value="${esc(a)}" ${a==v?'selected':''}>${esc(b)}</option>`).join('')}</select></label>`;
function modal(t,body,ok,lab='Guardar'){const m=document.createElement('div');m.className='ov';m.innerHTML=`<form class="md"><h2>${t}</h2>${body}<div class="row end"><button type="button" class="b g" data-x>Cerrar</button>${ok?`<button class="b">${lab}</button>`:''}</div></form>`;document.body.append(m);const f=m.firstChild,close=()=>m.remove();m.querySelector('[data-x]').onclick=close;m.onclick=e=>{if(e.target===m)close()};f.onsubmit=e=>{e.preventDefault();if(ok&&ok(Object.fromEntries(new FormData(f)),f)!==false)close()};return{f,close}}
// disponibilidad y conflictos
const blocksOn=d=>D.blocks.filter(b=>b.from<=d&&d<=b.to);
function conflict(date,st,dur,ign){const s=tm(st),e=s+dur,tr=+D.travel||0;
for(const l of D.lessons)if(l.id!==ign&&l.status==='agendada'&&l.date===date&&s<tm(l.start)+l.dur+tr&&e>tm(l.start)-tr)return`Se superpone con la clase de ${sn(S(l.sid))} (${l.start}–${end(l)})`;
for(const b of blocksOn(date))if(!b.st||(s<tm(b.en)&&e>tm(b.st)))return`Hay un bloqueo: ${b.why||'no disponible'}`;return''}
function free(d,dur=30){let iv=((D.exc||{})[d]||D.avail[wd(d)]||[]).map(([a,b])=>[tm(a),tm(b)]);const tr=+D.travel||0,busy=D.lessons.filter(l=>l.status==='agendada'&&l.date===d).map(l=>[tm(l.start)-tr,tm(l.start)+l.dur+tr]);
for(const b of blocksOn(d))busy.push(b.st?[tm(b.st),tm(b.en)]:[0,1440]);
for(const[x,y]of busy)iv=iv.flatMap(([a,b])=>y<=a||x>=b?[[a,b]]:[...(x>a?[[a,x]]:[]),...(y<b?[[y,b]]:[])]);return iv.filter(([a,b])=>b-a>=dur)}
const dayIv=d=>(D.exc||{})[d]||D.avail[wd(d)]||[];const inAvail=(d,st,dur)=>dayIv(d).some(([a,b])=>tm(a)<=tm(st)&&tm(b)>=tm(st)+dur);
// vistas
const card=l=>{const[a,b]=CL[CAT(l)],[p,q]=PS(l);return`<button class="card les" data-a="les" data-i="${l.id}"><b>${l.start}–${end(l)}</b><span>${esc(sn(S(l.sid)))}</span><span class="m">${esc(T(l.tid)?.n||'')}</span><span class="bd ${b}">${a}</span>${p?`<span class="bd ${q}">${p}</span>`:''}</button>`};
const lessonsOf=d=>D.lessons.filter(l=>l.date===d).sort((a,b)=>a.start.localeCompare(b.start));
const stat=(k,l)=>`<div class="card"><div class="k">${k}</div><div class="m">${l}</div></div>`;
const V={
inicio(){const t=today(),A=D.lessons,mes=G.mes;
const cobrado=D.pays.filter(p=>p.date.startsWith(mes)).reduce((a,p)=>a+p.amt,0),pend=A.reduce((a,l)=>a+debt(l),0),cargos=A.filter(l=>l.date.startsWith(mes)&&amt(l)!=null).reduce((a,l)=>a+amt(l),0);
const hoy=lessonsOf(t).filter(l=>l.status==='agendada');
return`<div class="row sp"><h2>Hoy, ${fd(t)}</h2><label class="row" style="margin:0">Período <input type="month" data-in="mes" value="${mes}" style="width:auto"></label></div>
<div class="row" style="margin:10px 0"><button class="b" data-a="agendar">Agendar clase</button><button class="b g" data-a="cli">Nuevo cliente</button><button class="b g" data-a="alu">Nuevo alumno</button><button class="b g" data-a="go" data-i="agenda">Agenda</button><button class="b g" data-a="go" data-i="pagos">Pagos pendientes</button><button class="b g" data-a="wa">Disponibilidad por WhatsApp</button></div>
<div class="gr">${stat(hoy.length,'Clases hoy')}${stat(A.filter(l=>l.status==='agendada'&&l.att==='sin'&&l.date>t).length,'Próximas')}${stat(A.filter(l=>CAT(l)==='asistio').length,'Realizadas')}${stat(A.filter(l=>CAT(l)==='pend').length,'Sin registrar asistencia')}${stat(D.students.filter(s=>s.on!=='0').length,'Alumnos activos')}${stat(A.filter(l=>['no','cancelada'].includes(CAT(l))).length,'Ausencias y canceladas')}${stat(money(cobrado),'Cobrado en el período')}${stat(money(cargos),'Cargos del período')}${stat(money(pend),'Saldo pendiente de cobro')}</div>
<h3 style="margin:16px 0 8px">Clases de hoy</h3>${hoy.map(card).join('')||'<p class="m">No hay clases hoy. Usá «Agendar clase» para crear una.</p>'}`},
agenda(){const{mode,date:d}=G;let body='';
const f=l=>(!G.fs||l.sid===G.fs)&&(!G.fst||(CAT(l)===G.fst));
if(mode==='dia')body=lessonsOf(d).filter(f).map(card).join('')||'<p class="m">Sin clases este día.</p>';
else if(mode==='semana'){const m=addD(d,-((wd(d)+6)%7));body=[0,1,2,3,4,5,6].map(i=>{const x=addD(m,i),L=lessonsOf(x).filter(f);return`<h3>${fd(x)}</h3>${L.map(card).join('')||'<p class="m">—</p>'}`}).join('')}
else{const p=d.slice(0,7),first=p+'-01',off=(wd(first)+6)%7,n=new Date(+p.slice(0,4),+p.slice(5),0).getDate();
body=`<div class="mes">${['L','M','M','J','V','S','D'].map(x=>`<button class="h">${x}</button>`).join('')}${'<i></i>'.repeat(off)}${Array.from({length:n},(_,i)=>{const x=p+'-'+String(i+1).padStart(2,'0'),c=lessonsOf(x).filter(l=>l.status==='agendada'&&f(l)).length;return`<button data-a="dia" data-i="${x}">${i+1}${c?`<br><span class="bd">${c}</span>`:''}</button>`}).join('')}</div>`}
const step=mode==='dia'?1:mode==='semana'?7:30;
return`<div class="row sp"><h2>Agenda</h2><button class="b" data-a="agendar">Agendar clase</button></div>
<div class="row" style="margin:8px 0">${['dia','semana','mes'].map(m=>`<button class="b ${m===mode?'':'g'}" data-a="mode" data-i="${m}">${{dia:'Día',semana:'Semana',mes:'Mes'}[m]}</button>`).join('')}<button class="b g" data-a="shift" data-i="-${step}">‹</button><input type="date" data-in="date" value="${d}" style="width:auto"><button class="b g" data-a="shift" data-i="${step}">›</button></div>
<div class="row"><div style="flex:1">${sel('Alumno','fs',[['','Todos'],...D.students.map(s=>[s.id,sn(s)])],G.fs,'data-in="fs"')}</div><div style="flex:1">${sel('Estado','fst',[['','Todos'],...Object.entries(CL).map(([k,v])=>[k,v[0]])],G.fst,'data-in="fst"')}</div></div>${body}`},
familias(){const q=G.q.toLowerCase(),L=D.clients.filter(c=>!q||(cn(c)+c.tel+c.wa+D.students.filter(s=>s.cid===c.id).map(sn).join(' ')).toLowerCase().includes(q));
return`<div class="row sp"><h2>Familias</h2><div class="row"><button class="b" data-a="cli">Nuevo cliente</button><button class="b g" data-a="alu">Nuevo alumno</button></div></div>${fld('Buscar por nombre, teléfono o alumno','q','search',G.q,'data-in="q"')}
${L.map(c=>{const al=D.students.filter(s=>s.cid===c.id);return`<div class="card"><div class="row sp"><b>${esc(cn(c))}</b>${c.on==='0'?'<span class="bd w">Inactivo</span>':''}</div><div class="m">${esc(c.tel||c.wa)}</div><div class="row" style="margin-top:6px">${al.map(s=>`<button class="b g" data-a="ficha" data-i="${s.id}">${esc(sn(s))}</button>`).join('')||'<span class="m">Sin alumnos</span>'}</div><div class="row end"><button class="b g" data-a="cliEdit" data-i="${c.id}">Editar</button><button class="b g" data-a="alu" data-i="${c.id}">+ Alumno</button><button class="b g" data-a="pago" data-i="${c.id}">Cuenta y pago</button><button class="b" data-a="msg" data-i="${c.id}">Escribir por WhatsApp</button></div></div>`}).join('')||'<p class="m">Todavía no hay clientes. Registrá el primero con «Nuevo cliente».</p>'}`},
pagos(){const deb=D.clients.map(c=>({c,L:D.lessons.filter(l=>cOf(l)===c.id&&debt(l)>0)})).filter(x=>x.L.length),tot=deb.reduce((a,x)=>a+x.L.reduce((b,l)=>b+debt(l),0),0);
const ms={};D.pays.forEach(p=>ms[p.date.slice(0,7)]=(ms[p.date.slice(0,7)]||0)+p.amt);
return`<div class="row sp"><h2>Pagos</h2><button class="b" data-a="pago">Registrar pago</button></div><div class="gr">${stat(money(tot),'Pendiente de cobro')}${stat(money(D.pays.reduce((a,p)=>a+p.amt,0)),'Total cobrado')}</div>
<h3 style="margin:14px 0 8px">Deudas por cliente</h3>${deb.map(x=>`<div class="card row sp"><span>${esc(cn(x.c))}<br><span class="m">${x.L.length} clases</span></span><span class="row"><b>${money(x.L.reduce((a,l)=>a+debt(l),0))}</b><button class="b" data-a="pago" data-i="${x.c.id}">Cobrar</button></span></div>`).join('')||'<p class="m">No hay saldos pendientes.</p>'}
<h3 style="margin:14px 0 8px">Resumen mensual cobrado</h3>${Object.entries(ms).sort().reverse().map(([m,v])=>`<div class="card row sp"><span>${m}</span><b>${money(v)}</b></div>`).join('')||'<p class="m">Sin pagos registrados.</p>'}
<h3 style="margin:14px 0 8px">Movimientos</h3>${[...D.pays].sort((a,b)=>b.date.localeCompare(a.date)).map(p=>`<div class="card"><div class="row sp"><b>${money(p.amt)}</b><span class="m">${p.date} · ${p.method}</span></div><div class="m">${esc(cn(C(p.cid)))} — ${p.alloc.length} clase(s) ${esc(p.note||'')}</div></div>`).join('')}`},
clases(){return`<div class="row sp"><h2>Tipos de clase</h2><button class="b" data-a="tipo">Nuevo tipo</button></div>${D.types.map(t=>`<button class="card" data-a="tipo" data-i="${t.id}"><b>${esc(t.n)}</b> ${t.on?'':'<span class="bd w">Inactivo</span>'}<div class="m">${t.dur} min — ${money(t.price)}<br>${esc(t.desc)}</div></button>`).join('')}`},
